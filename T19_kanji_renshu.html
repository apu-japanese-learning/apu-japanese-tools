<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanji Vocabulary Typing – Topic 19</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937}main{max-width:620px;margin:auto;padding:20px}
.panel{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:28px;box-shadow:0 5px 18px #1e293b12}.start{text-align:center;padding:28px 18px}.start h2{font-size:20px;margin:0 0 8px}.start p,.small{font-size:12px;color:#64748b}.partbtn{display:block;width:100%;margin:10px 0;padding:14px;border:1px solid #cbd5e1;border-radius:11px;background:#f8fafc;font-size:16px;font-weight:700;cursor:pointer}
.head{display:flex;align-items:center;font-size:14px;margin-bottom:10px}.count{margin-left:auto;color:#64748b}.home,.fs{border:0;background:none;color:#64748b;cursor:pointer}.home{padding:0 9px 0 0}.fs{font-size:17px;padding:0 0 0 9px}
.bar{height:6px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-bottom:13px}#prog{height:100%;background:#334155}.label,.help{font-size:13px;color:#64748b;margin-bottom:8px}.sentence{font-size:26px;font-weight:650;line-height:1.85;min-height:135px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}.choice{border:1px solid #cbd5e1;background:#f8fafc;border-radius:9px;padding:8px 5px;text-align:center;font-size:18px}
input{width:100%;font-size:23px;padding:13px 14px;border:2px solid #cbd5e1;border-radius:10px;outline:none}input:focus{border-color:#64748b}.buttons{display:flex;gap:8px;margin-top:10px}button.action{border:0;border-radius:9px;padding:12px;font-size:15px;font-weight:650;cursor:pointer;flex:1}#check{background:#1f2937;color:#fff}#next{background:#e2e8f0}button:disabled{opacity:.45}
#fb{min-height:48px;margin-top:10px;font-size:18px}.ok{color:#15803d}.ng{color:#b91c1c}.answerinfo{margin-top:5px;color:#475569;font-weight:500;line-height:1.5}.finish{text-align:center;padding:25px}.score{font-size:38px;font-weight:800;margin:8px}
:fullscreen body{background:#f4f7fb}:fullscreen main{max-width:760px;padding:24px}:fullscreen .panel{padding:30px}:fullscreen .sentence{font-size:clamp(23px,3vw,34px);min-height:150px}:fullscreen .choice{font-size:18px;padding:13px}:fullscreen input{font-size:24px}

@media(max-width:520px){
 main{padding:10px}
 .panel{padding:20px}
 .sentence{font-size:22px;min-height:110px}
 .choice{font-size:16px}
 input{font-size:20px}
}
</style></head><body><main><div id="app"></div></main><script>
const SETS={"Part 1": [{"word": "分野", "sentence": "マーケティングの（　　　　）に興味があります。", "answer": "分野", "reading": "ぶんや", "english": "field"}, {"word": "野菜", "sentence": "毎日、（　　　　）を食べるようにしています。", "answer": "野菜", "reading": "やさい", "english": "vegetables"}, {"word": "政治", "sentence": "私は日本の（　　　　）のニュースを見たり、読んだりします。", "answer": "政治", "reading": "せいじ", "english": "politics"}, {"word": "政府", "sentence": "日本の（　　　　）はいろいろな問題があります。", "answer": "政府", "reading": "せいふ", "english": "government"}, {"word": "治る", "sentence": "かぜが（　　　　）ないとき、病院に行きます。", "answer": "治ら", "reading": "なおる", "english": "to recover"}, {"word": "治す", "sentence": "かぜを（　　　　）ために、あたたかい物を食べます。", "answer": "治す", "reading": "なおす", "english": "to cure"}, {"word": "経験する", "sentence": "日本でたいへんなことを（　　　　）しました。", "answer": "経験", "reading": "けいけんする", "english": "to experience"}, {"word": "経営する", "sentence": "私は、自分の会社を（　　　　）したいです。", "answer": "経営", "reading": "けいえいする", "english": "to manage a business"}, {"word": "経営学", "sentence": "専門は（　　　　）です。", "answer": "経営学", "reading": "けいえいがく", "english": "business administration"}, {"word": "経済", "sentence": "日本の（　　　　）は少しずつよくなっています。", "answer": "経済", "reading": "けいざい", "english": "economy"}, {"word": "経済学", "sentence": "今学期、（　　　　）の授業を取っています。", "answer": "経済学", "reading": "けいざいがく", "english": "economics"}, {"word": "歴史", "sentence": "私は日本の（　　　　）をよく知っています。", "answer": "歴史", "reading": "れきし", "english": "history"}, {"word": "世界史", "sentence": "高校のとき、（　　　　）を勉強しました。", "answer": "世界史", "reading": "せかいし", "english": "world history"}, {"word": "文化", "sentence": "日本の（　　　　）の中で、食べ物に興味があります。", "answer": "文化", "reading": "ぶんか", "english": "culture"}, {"word": "変化する", "sentence": "日本に来た後、興味が（　　　　）しました。", "answer": "変化", "reading": "へんかする", "english": "to change"}, {"word": "化学", "sentence": "高校のとき、（　　　　）を勉強しました。", "answer": "化学", "reading": "かがく", "english": "chemistry"}], "Part 2": [{"word": "科目", "sentence": "今、六つの（　　　　）をとっています。", "answer": "科目", "reading": "かもく", "english": "subject / course"}, {"word": "理科", "sentence": "高校のとき、（　　　　）が好きでした。", "answer": "理科", "reading": "りか", "english": "science"}, {"word": "数", "sentence": "このクラスは学生の（　　　　）が多いです。", "answer": "数", "reading": "かず", "english": "number / amount"}, {"word": "数えます", "sentence": "よくさいふの中のお金を（　　　　）ます。", "answer": "数え", "reading": "かぞえます", "english": "to count"}, {"word": "数学", "sentence": "専門のため、（　　　　）を勉強します。", "answer": "数学", "reading": "すうがく", "english": "mathematics"}, {"word": "数字", "sentence": "日本語で（　　　　）を言うのはむずかしいです。", "answer": "数字", "reading": "すうじ", "english": "number / numeral"}, {"word": "回数", "sentence": "コンビニ行く（　　　　）は多いです。", "answer": "回数", "reading": "かいすう", "english": "frequency / number of times"}, {"word": "点数", "sentence": "復習のクイズの（　　　　）がよかったです。", "answer": "点数", "reading": "てんすう", "english": "score / points"}, {"word": "教えます", "sentence": "友だちに日本語を（　　　　）ることがあります。", "answer": "教え", "reading": "おしえます", "english": "to teach"}, {"word": "教室", "sentence": "授業の前に（　　　　）で友だちと話します。", "answer": "教室", "reading": "きょうしつ", "english": "classroom"}, {"word": "育つ", "sentence": "私はにぎやかな町で（　　　　）ました。", "answer": "育ち", "reading": "そだつ", "english": "to grow up"}, {"word": "育てる", "sentence": "ペットを（　　　　）ています。", "answer": "育て", "reading": "そだてる", "english": "to raise"}, {"word": "教育", "sentence": "日本の（　　　　）システムはいいです。", "answer": "教育", "reading": "きょういく", "english": "education"}, {"word": "言う", "sentence": "友だちに「ありがとう」と（　　　　）ました。", "answer": "言い", "reading": "いう", "english": "to say"}, {"word": "言葉", "sentence": "最近、新しい日本語の（　　　　）を覚えました。", "answer": "言葉", "reading": "ことば", "english": "word / language"}, {"word": "言語", "sentence": "大学でいろいろな（　　　　）を勉強できます。", "answer": "言語", "reading": "げんご", "english": "language"}, {"word": "研究する", "sentence": "先生は、日本の文化を（　　　　）しています。", "answer": "研究", "reading": "けんきゅうする", "english": "to research"}, {"word": "研究者", "sentence": "私は大学の（　　　　）になって、専門を教えたたいです。", "answer": "研究者", "reading": "けんきゅうしゃ", "english": "researcher"}, {"word": "研究室", "sentence": "きのう、先生の（　　　　）に行きました。", "answer": "研究室", "reading": "けんきゅうしつ", "english": "research office"}, {"word": "レポート", "sentence": "このセメスターに、たくさん（　　　　）を出さなければなりません。", "answer": "レポート", "reading": "レポート", "english": "report"}, {"word": "コース", "sentence": "ビジネス日本語の（　　　　）をとりたいです。", "answer": "コース", "reading": "コース", "english": "course"}, {"word": "シラバス", "sentence": "授業の前に（　　　　）を読みました。", "answer": "シラバス", "reading": "シラバス", "english": "syllabus"}]};let data=[],order=[],i=0,score=0,done=false,currentPart="";const app=document.getElementById("app");
function sh(a){for(let n=a.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[a[n],a[k]]=[a[k],a[n]]}return a}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
function fsIcon(){document.querySelectorAll(".fs").forEach(b=>b.textContent=document.fullscreenElement?"✕":"⛶")}document.addEventListener("fullscreenchange",fsIcon);
function startScreen(){app.innerHTML=`<div class="panel start"><div style="text-align:right"><button class="fs" onclick="fs()">⛶</button></div><h2>Kanji Vocabulary Typing – Topic 19</h2><p>Choose a part to practice.</p><button class="partbtn" onclick="startPart('Part 1')">Part 1 <span class="small">(${SETS["Part 1"].length} questions)</span></button><button class="partbtn" onclick="startPart('Part 2')">Part 2 <span class="small">(${SETS["Part 2"].length} questions)</span></button></div>`;fsIcon()}
function startPart(p){currentPart=p;data=SETS[p];order=sh([...Array(data.length).keys()]);i=0;score=0;render()}
function opts(t){let pool=[...new Set(data.map(x=>x.word).filter(x=>x!==t))];sh(pool);return sh([t,...pool.slice(0,3)])}
function render(){done=false;let q=data[order[i]];app.innerHTML=`<div class="head"><button class="home" onclick="startScreen()">⌂ Top</button><b>${currentPart}</b><span class="count">${i+1} / ${data.length}</span><button class="fs" onclick="fs()">⛶</button></div><div class="bar"><div id="prog" style="width:${i/data.length*100}%"></div></div><div class="panel"><div class="label">Choose from the 4 words and type the missing kanji vocabulary.</div><div class="sentence">${q.sentence}</div><div class="help">Word Bank</div><div class="choices">${opts(q.word).map(x=>`<div class="choice">${x}</div>`).join("")}</div><input id="ans" placeholder="Type the missing word" autocomplete="off"><div class="buttons"><button class="action" id="check" onclick="check()">Check</button><button class="action" id="next" onclick="next()" disabled>Next</button></div><div id="fb"></div></div>`;fsIcon();let a=document.getElementById("ans");a.focus();a.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();done?next():check()}})}
function check(){if(done)return;let q=data[order[i]],v=document.getElementById("ans").value.trim();done=true;let fb=document.getElementById("fb"),good=v===q.answer;if(good)score++;fb.className=good?"ok":"ng";fb.innerHTML=(good?"<b>✓ Correct!</b>":(v?"<b>✗ Answer: "+q.answer+"</b>":"<b>Answer: "+q.answer+"</b>"))+`<div class="answerinfo">Reading: <b>${q.reading}</b><br>English: <b>${q.english}</b></div>`;document.getElementById("ans").disabled=true;document.getElementById("check").disabled=true;document.getElementById("next").disabled=false;document.getElementById("next").focus()}
function next(){i++;if(i<data.length){render();return}app.innerHTML=`<div class="panel finish"><button class="fs" style="float:right" onclick="fs()">⛶</button><div class="small">${currentPart} Finished</div><div class="score">${score} / ${data.length}</div><div class="buttons"><button class="action" onclick="startPart('${currentPart}')">Practice Again</button><button class="action" onclick="startScreen()">⌂ Top</button></div></div>`;fsIcon()}
startScreen();</script></body></html>
