<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Typing Practice</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#202735;font-family:Arial,"Yu Gothic",sans-serif}main{max-width:790px;margin:auto;padding:22px}h1{margin:0;font-size:clamp(26px,5vw,38px)}.top{display:flex;justify-content:space-between;gap:12px;align-items:end}.muted{color:#6b7685}.track{height:8px;background:#dfe5ed;border-radius:9px;overflow:hidden;margin:18px 0 28px}.fill{height:100%;background:#315fcb}.panel{background:#fff;border:1px solid #dce3ec;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 9px 28px #0001}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#8994a2;font-weight:bold}.bank{display:flex;flex-wrap:wrap;gap:10px;margin:13px 0 7px}.chip{padding:9px 15px;background:#f3f6fa;border:1px solid #d7dfe9;border-radius:10px;font-weight:bold;pointer-events:none;user-select:none}.help{font-size:13px;color:#87919e;margin:0 0 28px}.q{font-size:clamp(21px,4vw,29px);font-weight:600;line-height:1.8;margin:17px 0 24px}input{width:100%;font:inherit;font-size:23px;padding:15px 17px;border:2px solid #bac6d6;border-radius:13px;outline:none}input:focus{border-color:#315fcb}input.good{border-color:#27864a;background:#effaf2}input.bad{border-color:#c84646;background:#fff1f1}.actions{display:flex;gap:10px;margin-top:16px}button{font:inherit;padding:11px 18px;border:1px solid #d3dce7;border-radius:11px;background:#fff;cursor:pointer}.primary{background:#294a91;color:#fff;border-color:#294a91}button:disabled{opacity:.4}.feedback{min-height:28px;margin-top:18px;font-size:18px;font-weight:bold}.ok{color:#278448}.no{color:#bd3939}.score{color:#687485;margin-top:10px}.end{display:none;text-align:center}.big{font-size:52px;font-weight:bold;margin:20px}@media(max-width:520px){main{padding:13px}.top{flex-direction:column;align-items:flex-start}.panel{padding:22px 17px}.actions{flex-wrap:wrap}.actions button{flex:1}}</style></head><body><main>
<div class="top"><div><h1>Vocabulary Typing Practice</h1><div class="muted">Look at the Word Bank and type the word that fits the blank.</div></div><b id="count"></b></div><div class="track"><div class="fill" id="fill"></div></div>
<section class="panel" id="quiz"><div class="label">Word Bank</div><div class="bank" id="bank"></div><p class="help">The words are hints only. Type your answer below.</p><div class="label">Question</div><div class="q" id="q"></div><input id="ans" lang="ja" autocomplete="off" spellcheck="false" placeholder="Type your answer here"><div class="actions"><button class="primary" id="check">Check</button><button id="next" disabled>Next →</button></div><div class="feedback" id="fb"></div><div class="score" id="score"></div></section>
<section class="panel end" id="end"><h2>Finished!</h2><div class="big" id="final"></div><div id="pct"></div><p><button class="primary" id="again">↻ Practice Again</button></p></section></main>
<script>const src=[{"sentence": "インターネットの情報を見て、アルバイトに（　　　　　）します。", "answers": ["応募"], "bank": ["接客", "通勤", "勤務", "応募", "販売"]}, {"sentence": "日本語ができなかったら、お客様の（　　　　　）は難しいです。", "answers": ["接客"], "bank": ["接客", "通勤", "勤務", "応募", "販売"]}, {"sentence": "授業があるので、5時から（　　　　　）します。", "answers": ["勤務"], "bank": ["接客", "通勤", "勤務", "応募", "販売"]}, {"sentence": "コンビニで新しい商品を（　　　　　）しています。", "answers": ["販売"], "bank": ["接客", "通勤", "勤務", "応募", "販売"]}, {"sentence": "近いので自転車で（　　　　　）します。", "answers": ["通勤"], "bank": ["接客", "通勤", "勤務", "応募", "販売"]}, {"sentence": "シフトに入れないので、先輩に（　　　　　）てもらいます。", "answers": ["代わっ"], "bank": ["片付ける", "通う", "通じる", "代わる", "迎える"]}, {"sentence": "受付でお客様を（　　　　　）ます。", "answers": ["迎え"], "bank": ["片付ける", "通う", "通じる", "代わる", "迎える"]}, {"sentence": "日本では、英語が（　　　　　）ない場所が多いので、困ります。", "answers": ["通じ"], "bank": ["片付ける", "通う", "通じる", "代わる", "迎える"]}, {"sentence": "大学には、バスで（　　　　　）ます。", "answers": ["通ってい", "通い"], "bank": ["片付ける", "通う", "通じる", "代わる", "迎える"]}, {"sentence": "お客様が帰った後、テーブルを（　　　　　）ます。", "answers": ["片付け"], "bank": ["片付ける", "通う", "通じる", "代わる", "迎える"]}, {"sentence": "アルバイトを始めて最初の3か月は、（　　　　　）が800円です。", "answers": ["時給"], "bank": ["現金", "担当", "時給", "手当", "歓迎"]}, {"sentence": "山田さんがこの面接を（　　　　　）します。", "answers": ["担当"], "bank": ["現金", "担当", "時給", "手当", "歓迎"]}, {"sentence": "このアルバイトは、経験がなくても、大（　　　　　）です。", "answers": ["歓迎"], "bank": ["現金", "担当", "時給", "手当", "歓迎"]}, {"sentence": "お会計は、（　　　　　）でお願いします。", "answers": ["現金"], "bank": ["現金", "担当", "時給", "手当", "歓迎"]}, {"sentence": "夜の10時から働くときは、（　　　　　）をもらえます。", "answers": ["手当"], "bank": ["現金", "担当", "時給", "手当", "歓迎"]}, {"sentence": "お客様の（　　　　　）を取ります。", "answers": ["注文"], "bank": ["調理", "注文", "清掃", "案内", "会計"]}, {"sentence": "レジで（　　　　　）をします。", "answers": ["会計"], "bank": ["調理", "注文", "清掃", "案内", "会計"]}, {"sentence": "コンビニのキッチンで簡単な（　　　　　）をします。", "answers": ["調理"], "bank": ["調理", "注文", "清掃", "案内", "会計"]}, {"sentence": "受付でお客様を（　　　　　）します。", "answers": ["案内"], "bank": ["調理", "注文", "清掃", "案内", "会計"]}, {"sentence": "時間があるとき、店内を（　　　　　）します。", "answers": ["清掃"], "bank": ["調理", "注文", "清掃", "案内", "会計"]}, {"sentence": "友達とシフトを（　　　　　）します。", "answers": ["交代"], "bank": ["交代", "代わり", "給料", "注文", "売り上げ"]}, {"sentence": "今月はお客様が少なくて、（　　　　　）が少なかったです。", "answers": ["売り上げ"], "bank": ["交代", "代わり", "給料", "注文", "売り上げ"]}, {"sentence": "（　　　　　）日は、毎月20日です。", "answers": ["給料"], "bank": ["交代", "代わり", "給料", "注文", "売り上げ"]}, {"sentence": "お客様の（　　　　　）を取ります。", "answers": ["注文"], "bank": ["交代", "代わり", "給料", "注文", "売り上げ"]}, {"sentence": "店長の（　　　　　）に、電話を取ります。", "answers": ["代わり"], "bank": ["交代", "代わり", "給料", "注文", "売り上げ"]}];let deck=[],i=0,points=0,done=false;const $=x=>document.getElementById(x);function sh(a){a=[...a];for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}function reset(){deck=sh(src).map(x=>({...x,bank:sh(x.bank)}));i=0;points=0}function norm(x){return x.trim().replace(/\s+/g,"")}function render(){let x=deck[i];done=false;$("q").textContent=x.sentence;$("bank").innerHTML="";x.bank.forEach(w=>{let s=document.createElement("span");s.className="chip";s.textContent=w;$("bank").appendChild(s)});$("ans").value="";$("ans").disabled=false;$("ans").className="";$("check").disabled=false;$("next").disabled=true;$("fb").textContent="";$("count").textContent=`Question ${i+1} / ${deck.length}`;$("fill").style.width=(i/deck.length*100)+"%";$("score").textContent=`Score: ${points} / ${i}`;setTimeout(()=>$("ans").focus(),30)}function check(){if(done)return;let x=deck[i],v=norm($("ans").value);if(!v){$("fb").textContent="Please type an answer.";$("fb").className="feedback no";return}done=true;let ok=x.answers.some(a=>norm(a)===v);if(ok){points++;$("ans").className="good";$("fb").textContent="✓ Correct!";$("fb").className="feedback ok"}else{$("ans").className="bad";$("fb").textContent="✗ Correct answer: "+x.answers.join(" / ");$("fb").className="feedback no"}$("ans").disabled=true;$("check").disabled=true;$("next").disabled=false;$("score").textContent=`Score: ${points} / ${i+1}`;$("next").focus()}function next(){if(!done)return;if(++i<deck.length)render();else finish()}function finish(){$("quiz").style.display="none";$("end").style.display="block";$("fill").style.width="100%";$("count").textContent="Complete";$("final").textContent=`${points} / ${deck.length}`;$("pct").textContent=`${Math.round(points/deck.length*100)}% correct`}function again(){$("end").style.display="none";$("quiz").style.display="block";reset();render();scrollTo({top:0,behavior:"smooth"})}$("check").onclick=check;$("next").onclick=next;$("again").onclick=again;$("ans").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();done?next():check()}});reset();render();</script></body></html>
