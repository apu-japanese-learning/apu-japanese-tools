<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Part-time Job Vocabulary Flashcards</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#202733;font-family:Arial,"Yu Gothic","Noto Sans JP",sans-serif}
main{max-width:800px;margin:auto;padding:22px}h1{margin:0 0 6px;font-size:clamp(27px,5vw,39px)}.sub{color:#697483;margin-bottom:18px;line-height:1.5}
.top,.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{background:#fff;border:1px solid #dce3ec;padding:8px 14px;border-radius:999px}
button{font:inherit;border:1px solid #d5dde8;background:#fff;border-radius:12px;padding:11px 15px;cursor:pointer}.track{height:7px;background:#e1e7ef;border-radius:10px;overflow:hidden;margin:13px 0 20px}#fill{height:100%;background:#315fcb;transition:.25s}
.scene{perspective:1200px;min-height:410px;cursor:pointer}.card{position:relative;min-height:410px;transition:transform .5s;transform-style:preserve-3d}.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid #dbe2eb;border-radius:25px;box-shadow:0 10px 30px #0000000b;padding:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.back{transform:rotateY(180deg);background:#fbfcff}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#8b95a2;font-weight:bold;margin-bottom:18px}
.word{font-size:clamp(40px,8vw,66px);font-weight:700;line-height:1.25}.example{margin-top:27px;padding-top:19px;border-top:1px solid #e3e8ef;width:min(100%,640px);font-size:clamp(18px,3.5vw,23px);line-height:1.7;color:#485463;white-space:pre-line}
.example b{font-size:13px;color:#8993a0;margin-right:7px}.reading{font-size:clamp(30px,6vw,48px);font-weight:700;margin-bottom:18px}.english{font-size:clamp(20px,4vw,29px);color:#485463;line-height:1.5}.hint{margin-top:22px;color:#929ba7;font-size:13px}.nav{margin-top:20px}.nav button{min-width:115px}
@media(max-width:560px){main{padding:12px}.face{padding:24px 16px}.scene,.card{min-height:410px}}
</style></head><body><main>
<h1>Part-time Job Vocabulary</h1><div class="sub">Front: Japanese word + original example sentence (when provided) · Back: reading + English</div>
<div class="top"><div class="badge" id="count"></div><button onclick="shuffleDeck(event)">🔀 Shuffle</button></div><div class="track"><div id="fill"></div></div>
<div class="scene" onclick="flip()"><div class="card" id="card">
<section class="face"><div class="label">Japanese</div><div class="word" id="word"></div><div class="example" id="example"></div><div class="hint">Click the card to reveal the answer</div></section>
<section class="face back"><div class="label">Reading & Meaning</div><div class="reading" id="reading"></div><div class="english" id="english"></div><div class="hint">Click the card to return</div></section>
</div></div><div class="nav"><button onclick="prev(event)">← Previous</button><button onclick="next(event)">Next →</button></div>
</main><script>
const original=[{"word": "応募する", "reading": "おうぼする", "english": "to apply", "example": "コンビニのバイトに応募します。"}, {"word": "対応する", "reading": "たいおうする", "english": "to handle / deal with", "example": "自分で対応できないので、店長を呼びます。"}, {"word": "書類", "reading": "しょるい", "english": "documents / paperwork", "example": "アルバイト先に書類を出します。"}, {"word": "履歴書", "reading": "りれきしょ", "english": "résumé / CV", "example": "日本語で履歴書を書きます。"}, {"word": "担当する", "reading": "たんとうする", "english": "to be in charge of", "example": "私は、レジを担当します。"}, {"word": "担当者", "reading": "たんとうしゃ", "english": "person in charge", "example": "面接の担当者は山田さんです。"}, {"word": "手当", "reading": "てあて", "english": "allowance", "example": "バスで来るなら、手当があります。"}, {"word": "給料", "reading": "きゅうりょう", "english": "salary / pay", "example": null}, {"word": "時給", "reading": "じきゅう", "english": "hourly wage", "example": "たくさん稼（かせ）ぎたいので、高い時給のアルバイトを探します。"}, {"word": "勤務する", "reading": "きんむする", "english": "to work / be on duty", "example": "週に3日、勤務します。"}, {"word": "出勤する", "reading": "しゅっきんする", "english": "to go to work / report for work", "example": "明日は、5時から出勤します。"}, {"word": "通う", "reading": "かよう", "english": "to commute / go regularly", "example": "アルバイト先までバスで通います。"}, {"word": "通勤する", "reading": "つうきんする", "english": "to commute to work", "example": "アルバイト先までバスで通勤します。"}, {"word": "通じる", "reading": "つうじる", "english": "to be understood", "example": "私の日本語が通じません。"}, {"word": "代わる", "reading": "かわる", "english": "to take someone's place / substitute", "example": "友達にシフトを代わってもらいます。"}, {"word": "交代する", "reading": "こうたいする", "english": "to switch / take turns", "example": "シフトの交代を頼まれました。"}, {"word": "代わり", "reading": "かわり", "english": "substitute / replacement", "example": "カンさんの代わりに、仕事をします。"}, {"word": "店員", "reading": "てんいん", "english": "store clerk / staff member", "example": null}, {"word": "従業員", "reading": "じゅうぎょういん", "english": "employee", "example": "この店の従業員は10名です。"}, {"word": "お客", "reading": "おきゃく", "english": "customer / guest", "example": null}, {"word": "接客", "reading": "せっきゃく", "english": "customer service", "example": "接客の仕事をしてみたいです。"}, {"word": "売る", "reading": "うる", "english": "to sell", "example": null}, {"word": "販売する", "reading": "はんばいする", "english": "to sell / offer for sale", "example": "おいしいお弁当を販売します。"}, {"word": "売り上げ", "reading": "うりあげ", "english": "sales / revenue", "example": null}, {"word": "迎える", "reading": "むかえる", "english": "to welcome / receive", "example": "あいさつをして、お客様をお迎えします。"}, {"word": "歓迎する", "reading": "かんげいする", "english": "to welcome", "example": "だれでも大歓迎です。\n来週、バイト先で歓迎会があります。"}, {"word": "管理する", "reading": "かんりする", "english": "to manage", "example": "店長がシフトを管理しています。"}, {"word": "調理する", "reading": "ちょうりする", "english": "to cook / prepare food", "example": "手を洗って、調理してください。"}, {"word": "清掃する", "reading": "せいそうする", "english": "to clean", "example": "1日3回、トイレを清掃しなければなりません。\nトイレは、今清掃中です。"}, {"word": "掃除する", "reading": "そうじする", "english": "to clean", "example": "駐車場を掃除します。"}, {"word": "付ける", "reading": "つける", "english": "to add / attach", "example": "定食にドリンクバーを付けました。"}, {"word": "付く", "reading": "つく", "english": "to come with / be included", "example": "このセットは、サラダが付いています。"}, {"word": "片付ける", "reading": "かたづける", "english": "to clear away / tidy up", "example": "お客が帰ったので、テーブルを片付けます。"}, {"word": "案内する", "reading": "あんないする", "english": "to show / guide", "example": "お客様をテーブル席に案内します。"}, {"word": "注文する", "reading": "ちゅうもんする", "english": "to order", "example": "料理を注文します。"}, {"word": "注意する", "reading": "ちゅういする", "english": "to be careful / pay attention", "example": "ミスがないように、注意してください。"}, {"word": "繰り返す", "reading": "くりかえす", "english": "to repeat", "example": "注文を繰り返します。"}, {"word": "返す", "reading": "かえす", "english": "to return / give back", "example": "カードをお返しします。"}, {"word": "返し", "reading": "かえし", "english": "change / amount returned", "example": "300円のお返しです。"}, {"word": "商品", "reading": "しょうひん", "english": "product / merchandise", "example": "商品の数を数えて、管理します。"}, {"word": "品", "reading": "しな", "english": "item / goods", "example": "ご注文のお品はおそろいでしょうか。"}, {"word": "会計", "reading": "かいけい", "english": "bill / checkout / payment", "example": "お客様のお会計は2200円です。"}, {"word": "料金", "reading": "りょうきん", "english": "fee / charge / price", "example": "食べ放題の料金は、3000円です。"}, {"word": "現金", "reading": "げんきん", "english": "cash", "example": "お支払いは現金でよろしいですか。"}];let deck=[...original],i=0;const $=x=>document.getElementById(x);
function render(){const x=deck[i];$('card').classList.remove('flipped');$('word').textContent=x.word;$('reading').textContent=x.reading;$('english').textContent=x.english;
if(x.example){$('example').style.display='block';$('example').innerHTML='<b>例：</b>'+x.example.replace(/\n/g,'<br>')}else{$('example').style.display='none';$('example').innerHTML=''}
$('count').textContent=`Card ${i+1} / ${deck.length}`;$('fill').style.width=((i+1)/deck.length*100)+'%'}
function flip(){$('card').classList.toggle('flipped')}function next(e){e.stopPropagation();i=(i+1)%deck.length;render()}function prev(e){e.stopPropagation();i=(i-1+deck.length)%deck.length;render()}
function shuffleDeck(e){e.stopPropagation();for(let n=deck.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[deck[n],deck[j]]=[deck[j],deck[n]]}i=0;render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){i=(i+1)%deck.length;render()}else if(e.key==='ArrowLeft'){i=(i-1+deck.length)%deck.length;render()}else if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}});
render();</script></body></html>
