<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanji Vocabulary Typing – Topic 20</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937}main{max-width:620px;margin:auto;padding:20px}
.panel{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:28px;box-shadow:0 5px 18px #1e293b12}.start{text-align:center;padding:28px 18px}.start h2{font-size:20px;margin:0 0 8px}.start p,.small{font-size:12px;color:#64748b}.partbtn{display:block;width:100%;margin:10px 0;padding:14px;border:1px solid #cbd5e1;border-radius:11px;background:#f8fafc;font-size:16px;font-weight:700;cursor:pointer}
.head{display:flex;align-items:center;font-size:14px;margin-bottom:10px}.count{margin-left:auto;color:#64748b}.home,.fs{border:0;background:none;color:#64748b;cursor:pointer}.home{padding:0 9px 0 0}.fs{font-size:17px;padding:0 0 0 9px}
.bar{height:6px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-bottom:13px}#prog{height:100%;background:#334155}.label,.help{font-size:13px;color:#64748b;margin-bottom:8px}.sentence{font-size:26px;font-weight:650;line-height:1.85;min-height:135px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}.choice{border:1px solid #cbd5e1;background:#f8fafc;border-radius:9px;padding:8px 5px;text-align:center;font-size:18px}
input{width:100%;font-size:23px;padding:13px 14px;border:2px solid #cbd5e1;border-radius:10px;outline:none}input:focus{border-color:#64748b}.buttons{display:flex;gap:8px;margin-top:10px}button.action{border:0;border-radius:9px;padding:12px;font-size:15px;font-weight:650;cursor:pointer;flex:1}#check{background:#1f2937;color:#fff}#next{background:#e2e8f0}button:disabled{opacity:.45}
#fb{min-height:48px;margin-top:10px;font-size:18px}.ok{color:#15803d}.ng{color:#b91c1c}.answerinfo{margin-top:5px;color:#475569;font-weight:500;line-height:1.5}.finish{text-align:center;padding:25px}.score{font-size:38px;font-weight:800;margin:8px}
:fullscreen body{background:#f4f7fb}:fullscreen main{max-width:760px;padding:24px}:fullscreen .panel{padding:30px}:fullscreen .sentence{font-size:clamp(23px,3vw,34px);min-height:150px}:fullscreen .choice{font-size:18px;padding:13px}:fullscreen input{font-size:24px}

@media(max-width:520px){
 main{padding:10px}
 .panel{padding:20px}
 .sentence{font-size:22px;min-height:110px}
 .choice{font-size:16px}
 input{font-size:20px}
}
</style></head><body><main><div id="app"></div></main><script>
const SETS={"Part 1":[{"word":"春","sentence":"（　　　　）に桜を見ます。","answer":"春","reading":"はる","english":"spring","choices":["春","島","国民","東口"]},{"word":"春学期","sentence":"（　　　　）にFoundation Ⅲをとりました。","answer":"春学期","reading":"はるがっき","english":"spring semester","choices":["春学期","島国","市民","特に"]},{"word":"春休み","sentence":"（　　　　）に国へ帰りました。","answer":"春休み","reading":"はるやすみ","english":"spring vacation","choices":["春休み","特徴がある","市民","島国"]},{"word":"夏","sentence":"日本の（　　　　）は暑いです。","answer":"夏","reading":"なつ","english":"summer","choices":["夏","島","国民","別府市"]},{"word":"夏休み","sentence":"（　　　　）にアルバイトをしました。","answer":"夏休み","reading":"なつやすみ","english":"summer vacation","choices":["夏休み","市民","島国","特に"]},{"word":"秋","sentence":"（　　　　）に、おいしい果物が食べられます。","answer":"秋","reading":"あき","english":"autumn","choices":["秋","島","市民","特別な"]},{"word":"秋学期","sentence":"（　　　　）は春学期より忙しいです。","answer":"秋学期","reading":"あきがっき","english":"fall semester","choices":["秋学期","島国","特に","市民"]},{"word":"冬","sentence":"日本の（　　　　）に何をしたいですか。","answer":"冬","reading":"ふゆ","english":"winter","choices":["冬","島","国民","特に"]},{"word":"冬休み","sentence":"（　　　　）に友だちとあそびました。","answer":"冬休み","reading":"ふゆやすみ","english":"winter vacation","choices":["冬休み","島国","市民","特に"]},{"word":"島","sentence":"日本には（　　　　）がたくさんあります。","answer":"島","reading":"しま","english":"island","choices":["島","市民","国民","特に"]},{"word":"島国","sentence":"日本は（　　　　）です。","answer":"島国","reading":"しまぐに","english":"island country","choices":["島国","市民","国民","特に"]},{"word":"バリ島","sentence":"（　　　　）に行ってみたいです。","answer":"バリ島","reading":"バリとう","english":"Bali island","choices":["バリ島","市民","国民","特に"]},{"word":"国民","sentence":"野球は（　　　　）に人気があります。","answer":"国民","reading":"こくみん","english":"citizens / people of a country","choices":["国民","島国","特に","春休み"]},{"word":"市民","sentence":"別府の（　　　　）と話すチャンスがあります。","answer":"市民","reading":"しみん","english":"city residents","choices":["市民","国民","島国","春学期"]},{"word":"特に","sentence":"私の町には、おいしい料理がたくさんあります。（　　　　）からあげがおいしいです。","answer":"特に","reading":"とくに","english":"especially","choices":["特に","別々に","島国","国民"]},{"word":"特徴","sentence":"別府は、どんな（　　　　）がありますか。","answer":"特徴","reading":"とくちょう","english":"characteristic","choices":["特徴","特別な","別々に","島国"]},{"word":"特別な","sentence":"日本では、1月1日は、（　　　　）日です。","answer":"特別な","reading":"とくべつな","english":"special","choices":["特別な","別々に","特に","島国"]},{"word":"別々に","sentence":"高校生のときから、家族と（　　　　）住んでいます。","answer":"別々に","reading":"べつべつに","english":"separately","choices":["別々に","特に","島国","国民"]},{"word":"別府市","sentence":"（　　　　）は、日本で有名です。","answer":"別府市","reading":"べっぷし","english":"Beppu City","choices":["別府市","国民","特に","別々に"]}],"Part 2":[{"word":"東","sentence":"（　　　　）京は日本の東にあります。","answer":"東","reading":"ひがし","english":"east","choices":["東","暑さ","以内","全体"]},{"word":"東口","sentence":"市役所に行きたいのですが、別府駅の（　　　　）から出ますか、西口から出ますか。","answer":"東口","reading":"ひがしぐち","english":"east exit","choices":["東口","寒さ","全体","以前"]},{"word":"東京","sentence":"（　　　　）に行ったことがあります。","answer":"東京","reading":"とうきょう","english":"Tokyo","choices":["東京","暑さ","全然","以内"]},{"word":"関東","sentence":"東京は（　　　　）にあります。","answer":"関東","reading":"かんとう","english":"Kanto region","choices":["関東","寒さ","声","以内"]},{"word":"西","sentence":"ふくおかは日本の（　　　　）にあります。","answer":"西","reading":"にし","english":"west","choices":["西","寒さ","以内","全体"]},{"word":"西口","sentence":"あなたはよく別府駅の東口を使いますか、（　　　　）を使いますか。","answer":"西口","reading":"にしぐち","english":"west exit","choices":["西口","暑さ","全体","以前"]},{"word":"関西","sentence":"大阪は（　　　　）にあります。","answer":"関西","reading":"かんさい","english":"Kansai region","choices":["関西","暑さ","声","以内"]},{"word":"南","sentence":"おきなわは日本の（　　　　）にあります。","answer":"南","reading":"みなみ","english":"south","choices":["南","寒さ","全体","以前"]},{"word":"南米","sentence":"ブラジルは（　　　　）にあります。","answer":"南米","reading":"なんべい","english":"South America","choices":["南米","暑さ","声","以内"]},{"word":"東南アジア","sentence":"タイは（　　　　）にあります。","answer":"東南アジア","reading":"とうなんアジア","english":"Southeast Asia","choices":["東南アジア","寒さ","全体","以前"]},{"word":"北","sentence":"日本の（　　　　）では、雪が降ります。","answer":"北","reading":"きた","english":"north","choices":["北","暑さ","以内","全体"]},{"word":"北米","sentence":"（　　　　）に住んでみたいです。","answer":"北米","reading":"ほくべい","english":"North America","choices":["北米","暑さ","全然","以内"]},{"word":"北海道","sentence":"（　　　　）でスキーをしたいです。","answer":"北海道","reading":"ほっかいどう","english":"Hokkaido","choices":["北海道","暑さ","声","以内"]},{"word":"暑い","sentence":"今日はとても（　　　　）です。","answer":"暑い","reading":"あつい","english":"hot (weather)","choices":["暑い","寒い","全体","以前"]},{"word":"暑さ","sentence":"日本の夏の（　　　　）は、私の国よりいいです。","answer":"暑さ","reading":"あつさ","english":"heat","choices":["暑さ","寒さ","全体","以前"]},{"word":"寒い","sentence":"10度以下になったら、（　　　　）と思います。","answer":"寒い","reading":"さむい","english":"cold (weather)","choices":["寒い","暑い","全体","以前"]},{"word":"寒さ","sentence":"私の町は、冬の（　　　　）がきびしいです。","answer":"寒さ","reading":"さむさ","english":"coldness","choices":["寒さ","暑さ","全体","以前"]},{"word":"以上","sentence":"夏に35度（　　　　）になります。","answer":"以上","reading":"いじょう","english":"at least / or more","choices":["以上","以下","以内","以外"]},{"word":"以下","sentence":"冬に、10度（　　　　）になります。","answer":"以下","reading":"いか","english":"at most / or less","choices":["以下","以上","以内","以外"]},{"word":"以前","sentence":"（　　　　）は、外国人が少なかったですが、今は多いです。","answer":"以前","reading":"いぜん","english":"before","choices":["以前","以内","以上","以外"]},{"word":"以内","sentence":"大分空港から、別府まで1時間（　　　　）に行けます。","answer":"以内","reading":"いない","english":"within","choices":["以内","以上","以下","以外"]},{"word":"以外","sentence":"母語（　　　　）に英語も話します。","answer":"以外","reading":"いがい","english":"besides / other than","choices":["以外","以上","以下","以内"]},{"word":"全部","sentence":"日本には、（　　　　）で8つのエリアがあります。","answer":"全部","reading":"ぜんぶ","english":"all","choices":["全部","全体","全然","以前"]},{"word":"全体","sentence":"日本（　　　　）で、大学は800ぐらいあります。","answer":"全体","reading":"ぜんたい","english":"entire / whole","choices":["全体","全部","全然","以前"]},{"word":"全然","sentence":"私の国では外国の料理を（　　　　）食べません。","answer":"全然","reading":"ぜんぜん","english":"not at all (with negative)","choices":["全然","全部","全体","以前"]},{"word":"声","sentence":"わたしは日本語で話すとき、（　　　　）が高くなります。","answer":"声","reading":"こえ","english":"voice","choices":["声","大声","寒さ","暑さ"]},{"word":"大声","sentence":"私の国の人は、電車の中で（　　　　）で話します。","answer":"大声","reading":"おおごえ","english":"loud voice","choices":["大声","声","全部","全体"]},{"word":"アジア","sentence":"（　　　　）のどの国に行ったことがありますか。","answer":"アジア","reading":"アジア","english":"Asia","choices":["アジア","寒さ","全体","以前"]},{"word":"ヨーロッパ","sentence":"（　　　　）からの友だちがいます。","answer":"ヨーロッパ","reading":"ヨーロッパ","english":"Europe","choices":["ヨーロッパ","暑さ","全体","以前"]},{"word":"北アメリカ","sentence":"（　　　　）からの友だちがいます。","answer":"北アメリカ","reading":"きたアメリカ","english":"North America","choices":["北アメリカ","寒さ","全体","以前"]},{"word":"南アメリカ","sentence":"（　　　　）からの友だちがいます。","answer":"南アメリカ","reading":"みなみアメリカ","english":"South America","choices":["南アメリカ","暑さ","全体","以前"]},{"word":"オセアニア","sentence":"オーストラリアは（　　　　）にあります。","answer":"オセアニア","reading":"オセアニア","english":"Oceania","choices":["オセアニア","寒さ","全体","以前"]},{"word":"アフリカ","sentence":"（　　　　）にはたくさんの国があります。","answer":"アフリカ","reading":"アフリカ","english":"Africa","choices":["アフリカ","暑さ","全体","以前"]}]};let data=[],order=[],i=0,score=0,done=false,currentPart="";const app=document.getElementById("app");
function sh(a){for(let n=a.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[a[n],a[k]]=[a[k],a[n]]}return a}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
function fsIcon(){document.querySelectorAll(".fs").forEach(b=>b.textContent=document.fullscreenElement?"✕":"⛶")}document.addEventListener("fullscreenchange",fsIcon);
function startScreen(){app.innerHTML=`<div class="panel start"><div style="text-align:right"><button class="fs" onclick="fs()">⛶</button></div><h2>Kanji Vocabulary Typing – Topic 20</h2><p>Choose a part to practice.</p><button class="partbtn" onclick="startPart('Part 1')">Part 1 <span class="small">(${SETS["Part 1"].length} questions)</span></button><button class="partbtn" onclick="startPart('Part 2')">Part 2 <span class="small">(${SETS["Part 2"].length} questions)</span></button></div>`;fsIcon()}
function startPart(p){currentPart=p;data=SETS[p];order=sh([...Array(data.length).keys()]);i=0;score=0;render()}
function opts(q){return sh([...q.choices])}
function render(){done=false;let q=data[order[i]];app.innerHTML=`<div class="head"><button class="home" onclick="startScreen()">⌂ Top</button><b>${currentPart}</b><span class="count">${i+1} / ${data.length}</span><button class="fs" onclick="fs()">⛶</button></div><div class="bar"><div id="prog" style="width:${i/data.length*100}%"></div></div><div class="panel"><div class="label">Choose from the 4 words and type the missing kanji vocabulary.</div><div class="sentence">${q.sentence}</div><div class="help">Word Bank</div><div class="choices">${opts(q).map(x=>`<div class="choice">${x}</div>`).join("")}</div><input id="ans" placeholder="Type the missing word" autocomplete="off"><div class="buttons"><button class="action" id="check" onclick="check()">Check</button><button class="action" id="next" onclick="next()" disabled>Next</button></div><div id="fb"></div></div>`;fsIcon();let a=document.getElementById("ans");a.focus();a.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();done?next():check()}})}
function check(){if(done)return;let q=data[order[i]],v=document.getElementById("ans").value.trim();done=true;let fb=document.getElementById("fb"),good=v===q.answer;if(good)score++;fb.className=good?"ok":"ng";fb.innerHTML=(good?"<b>✓ Correct!</b>":(v?"<b>✗ Answer: "+q.answer+"</b>":"<b>Answer: "+q.answer+"</b>"))+`<div class="answerinfo">Reading: <b>${q.reading}</b><br>English: <b>${q.english}</b></div>`;document.getElementById("ans").disabled=true;document.getElementById("check").disabled=true;document.getElementById("next").disabled=false;document.getElementById("next").focus()}
function next(){i++;if(i<data.length){render();return}app.innerHTML=`<div class="panel finish"><button class="fs" style="float:right" onclick="fs()">⛶</button><div class="small">${currentPart} Finished</div><div class="score">${score} / ${data.length}</div><div class="buttons"><button class="action" onclick="startPart('${currentPart}')">Practice Again</button><button class="action" onclick="startScreen()">⌂ Top</button></div></div>`;fsIcon()}
startScreen();</script></body></html>
