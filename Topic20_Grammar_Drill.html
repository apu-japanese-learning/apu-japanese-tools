<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>トピック20 文法ドリル</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#192a3b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 16px 80px}header{background:#183b64;color:white;padding:25px;border-radius:15px}h1{font-size:1.5rem;margin:0 0 10px}.sub{opacity:.9;font-size:.92rem}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;background:white;border:1px solid #cbd5e1;border-radius:10px;padding:13px;font-size:1rem;cursor:pointer}.tabs button.active{background:#183b64;color:white}.panel{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 20px;flex-wrap:wrap}.score{font-weight:700;font-size:1.15rem}.question{background:white;border:1px solid #dce4ed;border-radius:13px;padding:20px;margin:14px 0}.qtitle{font-weight:700;margin-bottom:12px;white-space:pre-line;line-height:1.85}.choices{display:grid;gap:9px}.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid #d1dce7;border-radius:9px;padding:11px;cursor:pointer;line-height:1.55}.choice:has(input:checked){background:#e9f3ff;border-color:#2563a6}.choice input{margin-top:5px;accent-color:#185caa}.choice.correct{background:#e7f6e9;border-color:#23934d}.choice.wrong{background:#fff0ef;border-color:#d55252}.feedback{margin-top:12px;font-weight:650}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button.primary{background:#185caa;color:white;border:0;border-radius:10px;padding:14px 22px;font-size:1rem;cursor:pointer}button.secondary{background:white;border:1px solid #aab9c9;border-radius:10px;padding:14px 18px;cursor:pointer}.notice{font-size:.88rem;color:#526477}.results{background:#e8f0fb;border-radius:12px;padding:18px;margin:14px 0}.hidden{display:none}button:focus-visible,input:focus-visible{outline:3px solid #ffae4a;outline-offset:3px}</style></head><body><main class="wrap"><header><h1>トピック20 文法ドリル</h1><div class="sub">32 questions | Part 1: 1–16 | Part 2: 17–32 | 16 points each</div></header><div class="tabs"><button id="tab0" class="active" onclick="switchPart(0)">Part 1 (1–16)</button><button id="tab1" onclick="switchPart(1)">Part 2 (17–32)</button></div><div class="panel"><span id="progress"></span><span class="score" id="score"></span></div><div id="result" aria-live="polite"></div><div id="questions"></div><div class="actions"><button class="primary" onclick="grade()">Check Score</button><button class="secondary" onclick="resetPart()">Try Again</button><button class="secondary" onclick="switchPart(1-part)">Switch Part</button></div><p class="notice">Each question is worth 1 point. You can check your score at any time, even if you have not finished. Your answers will be lost when you close this page.</p></main><script>
const data=[{"n": 1, "q": "日本は私の国より大きいです。私の国は日本ほど（ ）。", "options": ["大きくないです", "大きいです", "小さいです", "小さくないです"], "answer": 0}, {"n": 2, "q": "A： 毎日、あついですね。\nB： そうですね。でも、わたしの国ほどあつくないです。わたしの国は日本（ ）あついですよ。", "options": ["より", "ほど", "は", "で"], "answer": 0}, {"n": 3, "q": "A： 日本のくだものは高いですよ。\nB： 私の国のくだものも高いですよ。でも、日本のくだもの（ ）。", "options": ["ほど高くないです", "ほど高いです", "より安くないです", "ほど安くないです"], "answer": 0}, {"n": 4, "q": "A: あれ、バスていにリーさんがいますね。\nB: そうですね。 どこかへ（ ）。", "options": ["行ってようです", "行くのようです", "行きようです", "行くようです"], "answer": 3}, {"n": 5, "q": "A: 道がぬれていますね。\nB: そうですね。きのうの夜、雨が（         ）。", "options": ["降るようです", "降らないようです", "降ったようです", "降りようです"], "answer": 2}, {"n": 6, "q": "A: よしださんは毎日、テレビを見ていますね。\nB: そうですね。よしださんは（      ）。", "options": ["ひまのようです", "ひまなようです", "ひまだようです", "ひまようです"], "answer": 0}, {"n": 7, "q": "A: あの学生は日本人ですか。\nB: 日本語のきょうかしょを持っていますから、（          ）。", "options": ["留学生なようです", "留学生だようです", "留学生のようです", "留学生ようです"], "answer": 2}, {"n": 8, "q": "A: B さん、なつ休みは何をするつもりですか。\nB: まだわかりませんが、私は国へ（          ）。", "options": ["帰るらしいです", "帰るようです", "帰るかもしれません", "帰るそうです"], "answer": 2}, {"n": 9, "q": "となりの教室は静かですから、だれも（          ）。", "options": ["いないらしいです", "いないことです", "いないそうです", "いないようです"], "answer": 3}, {"n": 10, "q": "ふゆ休みは日本でアルバイト（        ）ことにしました。", "options": ["するの", "して", "した", "する"], "answer": 3}, {"n": 11, "q": "けんこうのために、たばこを（      ）ことにしました。", "options": ["すうの", "すわない", "すう", "すって"], "answer": 1}, {"n": 12, "q": "来学期はアルバイトが忙しいので、経営学のじゅぎょうを（                 ）。", "options": ["とることにしませんでした", "とることにしました", "とらないことにしました", "とらないことにしませんでした"], "answer": 2}, {"n": 13, "q": "キムさん（ ）かみが短いです。", "options": ["で", "は", "に", "を"], "answer": 1}, {"n": 14, "q": "私の町は海（ ）きれいです。", "options": ["の", "を", "が", "に"], "answer": 2}, {"n": 15, "q": "（ ）きれいです。", "options": ["リーさんは目が", "目がリーさんの", "目のリーさんは", "リーさんは目を"], "answer": 0}, {"n": 16, "q": "（ ）有名です。", "options": ["おんせんのべっぷは", "べっぷはおんせんが", "べっぷでおんせんを", "おんせんがべっぷの"], "answer": 1}, {"n": 17, "q": "まどを（ ）ままねたら、かぜをひいてしまいました。", "options": ["開けて", "開け", "開けた", "開ける"], "answer": 2}, {"n": 18, "q": "このじてんしゃは、あまり使っていないので、（            ）ままです。", "options": ["きれい", "きれいな", "きれいだ", "きれいの"], "answer": 1}, {"n": 19, "q": "日本人は（ ）まま魚を食べます。", "options": ["生な", "生だ", "生", "生の"], "answer": 3}, {"n": 20, "q": "この料理はあたためないで、（       ）まま食べてください。", "options": ["そこ", "そのの", "それ", "その"], "answer": 3}, {"n": 21, "q": "リーさんは魚の（     ）上手に泳げます。", "options": ["ような", "よう", "ようだ", "ように"], "answer": 3}, {"n": 22, "q": "私は母の（ ）人になりたいです。", "options": ["ように", "ようだ", "ような", "よう"], "answer": 2}, {"n": 23, "q": "リーさんの部屋は、ホテルの（         ）きれいです。", "options": ["ように", "ようだ", "ような", "ようだ"], "answer": 0}, {"n": 24, "q": "友だちは歌手の（        ）歌を歌うことができます。", "options": ["よう", "ような", "ように", "ようだ"], "answer": 2}, {"n": 25, "q": "となりの部屋から、大きい音（         ）しました。", "options": ["で", "に", "が", "を"], "answer": 2}, {"n": 26, "q": "A: 何か、いいにおい（      ）しますね。\nB: リーさんが料理をしているんですよ。", "options": ["に", "が", "で", "を"], "answer": 1}, {"n": 27, "q": "A: このズボンはちょっと長すぎますね。\nB: じゃ、少し（ ）しましょうか。", "options": ["短いに", "短くて", "短く", "短い"], "answer": 2}, {"n": 28, "q": "A: きたない部屋ですね。\nB: そうじして、（ ）しましょう。", "options": ["きれいに", "きれいが", "きれく", "短い"], "answer": 0}, {"n": 29, "q": "電気をつけて、部屋（        ）明るくします。", "options": ["を", "で", "が", "に"], "answer": 0}, {"n": 30, "q": "電気をつけたら、部屋（        ）明るくなりました。", "options": ["が", "を", "で", "に"], "answer": 0}, {"n": 31, "q": "なつになると、（     ）。", "options": ["さむくなります", "さむくします", "あつくなります", "あつくします"], "answer": 2}, {"n": 32, "q": "字が見にくいので、（ ）ください。", "options": ["大きくして", "大きくなって", "小さくなって", "小さくして"], "answer": 0}];let part=0;const responses=Array(32).fill(null),graded=[false,false];const $=id=>document.getElementById(id);
function switchPart(p){part=p;for(let i=0;i<2;i++)$('tab'+i).classList.toggle('active',i===p);render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let start=part*16,items=data.slice(start,start+16),count=items.filter(x=>responses[x.n-1]!==null).length;$('progress').textContent=`Answered: ${count} / 16`;$('score').textContent=graded[part]?`Score: ${items.filter(x=>responses[x.n-1]===x.answer).length} / 16`:'Score not checked yet';$('result').innerHTML=graded[part]?`<div class="results"><strong>${part?'あと':'まえ'}の Score: ${items.filter(x=>responses[x.n-1]===x.answer).length} / 16</strong><p>Unanswered questions count as 0 points. You can change your answers after checking your score; the score updates automatically.</p></div>`:'';
$('questions').innerHTML=items.map(x=>`<section class="question"><div class="qtitle">${x.n}. ${escapeHTML(x.q)}</div><div class="choices">${x.options.map((o,i)=>`<label class="choice ${graded[part]&&i===x.answer?'correct':''} ${graded[part]&&responses[x.n-1]===i&&i!==x.answer?'wrong':''}"><input type="radio" name="q${x.n}" value="${i}" ${responses[x.n-1]===i?'checked':''} ><span><strong>${'abcd'[i]}.</strong> ${escapeHTML(o)}</span></label>`).join('')}</div>${graded[part]?`<div class="feedback">${responses[x.n-1]===x.answer?'✓ Correct!':'Correct answer: '+ 'abcd'[x.answer] +(responses[x.n-1]===null?' (Not answered)':'')}</div>`:''}</section>`).join('');$('questions').querySelectorAll('input').forEach(el=>el.addEventListener('change',e=>{responses[Number(e.target.name.slice(1))-1]=Number(e.target.value);if(graded[part])render();else $('progress').textContent=`Answered: ${data.slice(start,start+16).filter(x=>responses[x.n-1]!==null).length} / 16`;}));}
function grade(){graded[part]=true;render();window.scrollTo({top:0,behavior:'smooth'})}
function resetPart(){for(let i=part*16;i<part*16+16;i++)responses[i]=null;graded[part]=false;render()}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();</script></body></html>
