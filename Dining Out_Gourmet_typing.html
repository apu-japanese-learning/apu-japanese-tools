<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant & Food Kanji Reading Typing Practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242b;font-family:Arial,"Yu Gothic","Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:20px}h1{margin:0 0 5px;font-size:clamp(25px,5vw,38px)}.sub{color:#697180;margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#fff;border:1px solid #dce2eb;padding:8px 12px;border-radius:999px}.track{height:7px;background:#e2e7ef;border-radius:10px;overflow:hidden;margin:14px 0 18px}.fill{height:100%;background:#315fcb}.panel{background:#fff;border:1px solid #dce2eb;border-radius:24px;padding:34px;box-shadow:0 10px 30px #00000010;text-align:center}.label{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#8a929e}.kanji{font-size:clamp(43px,9vw,72px);font-weight:700;margin:8px 0}.english{font-size:clamp(20px,4vw,29px);color:#4f5967;margin-bottom:28px}.prompt{text-align:left;max-width:500px;margin:0 auto 7px;font-weight:700}input{width:100%;max-width:500px;font-size:26px;padding:14px 16px;border:2px solid #ccd4df;border-radius:14px;outline:none;text-align:center}input:focus{border-color:#315fcb}.buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}button{font:inherit;border:1px solid #d7dde7;background:#fff;border-radius:12px;padding:11px 17px;cursor:pointer}.primary{background:#315fcb;color:#fff;border-color:#315fcb}.feedback{min-height:72px;margin-top:18px;font-size:20px;font-weight:700}.correct{color:#16834a}.wrong{color:#c0392b}.answer{display:block;font-size:24px;margin-top:5px;color:#20242b}.alt{display:block;font-size:14px;font-weight:normal;color:#697180;margin-top:6px}.summary{display:none}.stats{font-size:24px;margin:18px 0}.footer{text-align:center;color:#8a929e;font-size:12px;margin-top:17px}@media(max-width:600px){.app{padding:12px}.panel{padding:25px 16px}input{font-size:23px}}</style></head><body><main class="app">
<h1>Restaurant & Food Typing Practice</h1><div class="sub">Type either the <b>kanji reading only</b> or the <b>full word reading</b> in hiragana.</div>
<div class="top"><div class="pill" id="count"></div><div class="pill">Score: <b id="score">0</b></div></div><div class="track"><div class="fill" id="fill"></div></div>
<section class="panel" id="quiz"><div class="label">Kanji / Word</div><div class="kanji" id="kanji"></div><div class="label">English</div><div class="english" id="english"></div><div class="prompt">Type the reading in hiragana:</div><input id="answer" lang="ja" autocomplete="off" spellcheck="false" placeholder="ひらがな"><div class="buttons"><button class="primary" id="checkBtn" onclick="check()">Check</button><button id="showBtn" onclick="showAnswer()">Show Answer</button><button id="nextBtn" onclick="next()" style="display:none">Next →</button></div><div class="feedback" id="feedback"></div></section>
<section class="panel summary" id="summary"><h2>Finished!</h2><div class="stats" id="final"></div><button class="primary" onclick="restart()">Try Again</button><button onclick="restart(true)">🔀 Shuffle & Retry</button></section>
<div class="footer">39 questions · Kanji-only readings and full-word readings are accepted where applicable.</div></main><script>
const original=[["食べる", "たべる", "to eat", ["たべる", "た"]], ["食べ放題", "たべほうだい", "all-you-can-eat", ["たべほうだい", "たほうだい"]], ["食事する", "しょくじする", "to have a meal / to eat", ["しょくじする", "しょくじ"]], ["外食する", "がいしょくする", "to eat out", ["がいしょくする", "がいしょく"]], ["食材", "しょくざい", "food ingredients", ["しょくざい"]], ["飲む", "のむ", "to drink", ["のむ", "の"]], ["飲み物", "のみもの", "drink / beverage", ["のみもの", "のもの"]], ["飲み放題", "のみほうだい", "all-you-can-drink", ["のみほうだい", "のほうだい"]], ["飲食店", "いんしょくてん", "restaurant / food establishment", ["いんしょくてん"]], ["営業する", "えいぎょうする", "to be open for business", ["えいぎょうする", "えいぎょう"]], ["営業時間", "えいぎょうじかん", "business / opening hours", ["えいぎょうじかん"]], ["席", "せき", "seat", ["せき"]], ["満席", "まんせき", "full / no seats available", ["まんせき"]], ["空く", "あく", "to become available / vacant", ["あく", "あ"]], ["混む", "こむ", "to be crowded", ["こむ", "こ"]], ["混ぜる", "まぜる", "to mix", ["まぜる", "ま"]], ["混雑する", "こんざつする", "to be crowded / congested", ["こんざつする", "こんざつ"]], ["予算", "よさん", "budget", ["よさん"]], ["予約", "よやく", "reservation / booking", ["よやく"]], ["味", "あじ", "taste / flavor", ["あじ"]], ["味わう", "あじわう", "to taste / savor", ["あじわう", "あじ"]], ["調味料", "ちょうみりょう", "seasoning / condiment", ["ちょうみりょう"]], ["人気", "にんき", "popularity / popular", ["にんき"]], ["雰囲気", "ふんいき", "atmosphere", ["ふんいき"]], ["気軽な", "きがるな", "casual / easy to approach", ["きがるな", "きがる"]], ["足りる", "たりる", "to be enough", ["たりる", "た"]], ["満足な／満足する", "まんぞくな／まんぞくする", "satisfied / to be satisfied", ["まんぞくな", "まんぞくする", "まんぞく"]], ["不満な", "ふまんな", "dissatisfied / unsatisfied", ["ふまんな", "ふまん"]], ["満点", "まんてん", "full marks; full of", ["まんてん"]], ["得／お得", "とく／おとく", "a good deal / good value", ["とく", "おとく"]], ["得る", "える", "to obtain / gain", ["える", "え"]], ["限定", "げんてい", "limited / limited edition", ["げんてい"]], ["定食", "ていしょく", "set meal", ["ていしょく"]], ["定番", "ていばん", "standard / classic", ["ていばん"]], ["定休日", "ていきゅうび", "regular closing day", ["ていきゅうび"]], ["提供する", "ていきょうする", "to provide / serve", ["ていきょうする", "ていきょう"]], ["地域", "ちいき", "area / region / community", ["ちいき"]], ["地元", "じもと", "local area / local", ["じもと"]], ["～向け", "～むけ", "for / aimed at / intended for", ["むけ", "む"]]];let deck=[...original],i=0,score=0,answered=false;const $=x=>document.getElementById(x);function norm(s){return s.trim().replace(/\s+/g,'').replace(/[・･]/g,'').replace(/[／/]/g,'')}
function render(){answered=false;$('answer').value='';$('answer').disabled=false;$('feedback').innerHTML='';$('checkBtn').style.display='inline-block';$('showBtn').style.display='inline-block';$('nextBtn').style.display='none';let c=deck[i];$('kanji').textContent=c[0];$('english').textContent=c[2];$('count').textContent=`Question ${i+1} / ${deck.length}`;$('score').textContent=score;$('fill').style.width=(i/deck.length*100)+'%';setTimeout(()=>$('answer').focus(),30)}
function finish(ok,shown=false){answered=true;$('answer').disabled=true;$('checkBtn').style.display='none';$('showBtn').style.display='none';$('nextBtn').style.display='inline-block';let c=deck[i];if(ok){score++;$('feedback').innerHTML='<span class="correct">✓ Correct!</span><span class="alt">Accepted: '+c[3].join(' / ')+'</span>'}else{$('feedback').innerHTML=(shown?'<span class="wrong">Answer:</span>':'<span class="wrong">✗ Incorrect</span>')+'<span class="answer">'+c[1]+'</span><span class="alt">Accepted: '+c[3].join(' / ')+'</span>'}$('score').textContent=score}
function check(){if(answered)return;let v=norm($('answer').value);if(!v){$('feedback').innerHTML='<span class="wrong">Please type an answer.</span>';return}finish(deck[i][3].some(a=>norm(a)===v))}
function showAnswer(){if(!answered)finish(false,true)}function next(){if(!answered){check();return}i++;if(i>=deck.length){$('quiz').style.display='none';$('summary').style.display='block';$('fill').style.width='100%';$('final').innerHTML=`Your score: <b>${score} / ${deck.length}</b><br>${Math.round(score/deck.length*100)}%`;return}render()}
function shuffle(){for(let n=deck.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[deck[n],deck[j]]=[deck[j],deck[n]]}}function restart(s=false){deck=[...original];if(s)shuffle();i=0;score=0;$('summary').style.display='none';$('quiz').style.display='block';render()}$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();answered?next():check()}});render();</script></body></html>
