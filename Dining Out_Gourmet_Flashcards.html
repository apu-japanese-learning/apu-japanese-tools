<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant & Food Flashcards</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#202733;font-family:Arial,"Yu Gothic",sans-serif}main{max-width:780px;margin:auto;padding:22px}h1{font-size:clamp(28px,5vw,40px);margin:0 0 6px}.sub{color:#697483;margin-bottom:18px}.top,.nav{display:flex;justify-content:space-between;gap:10px}.badge{background:#fff;border:1px solid #dce3ec;padding:8px 14px;border-radius:999px}button{font:inherit;border:1px solid #d5dde8;background:#fff;border-radius:12px;padding:11px 15px;cursor:pointer}.track{height:7px;background:#e1e7ef;border-radius:10px;overflow:hidden;margin:13px 0 20px}#fill{height:100%;background:#315fcb}.scene{perspective:1200px;min-height:400px;cursor:pointer}.card{position:relative;min-height:400px;transform-style:preserve-3d;transition:.5s}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid #dbe2eb;border-radius:25px;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 30px #0000000b}.back{transform:rotateY(180deg)}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#8b95a2;font-weight:bold;margin-bottom:18px}.word{font-size:clamp(40px,8vw,64px);font-weight:700}.example{margin-top:27px;padding-top:19px;border-top:1px solid #e3e8ef;width:min(100%,610px);font-size:clamp(18px,3.5vw,24px);line-height:1.65;color:#485463;white-space:pre-line}.reading{font-size:clamp(30px,6vw,48px);font-weight:700;margin-bottom:18px}.english{font-size:clamp(20px,4vw,29px);color:#485463}.hint{margin-top:22px;color:#929ba7;font-size:13px}.nav{margin-top:20px}@media(max-width:560px){main{padding:12px}.face{padding:24px 15px}}</style></head>
<body><main><h1>Restaurant & Food Flashcards</h1><div class="sub">Front: Japanese word + original example (when provided) · Back: reading + English</div><div class="top"><div class="badge" id="count"></div><button onclick="shuffle(event)">🔀 Shuffle</button></div><div class="track"><div id="fill"></div></div>
<div class="scene" onclick="flip()"><div class="card" id="card"><section class="face"><div class="label">Japanese</div><div class="word" id="word"></div><div class="example" id="example"></div><div class="hint">Click to reveal the answer</div></section><section class="face back"><div class="label">Reading & Meaning</div><div class="reading" id="reading"></div><div class="english" id="english"></div><div class="hint">Click to return</div></section></div></div><div class="nav"><button onclick="prev(event)">← Previous</button><button onclick="next(event)">Next →</button></div></main>
<script>const original=[{"word": "食べる", "reading": "たべる", "english": "to eat", "example": null}, {"word": "食べ放題", "reading": "たべほうだい", "english": "all-you-can-eat", "example": null}, {"word": "食事する", "reading": "しょくじする", "english": "to have a meal / to eat", "example": null}, {"word": "外食する", "reading": "がいしょくする", "english": "to eat out", "example": "レストランで外食します。"}, {"word": "食材", "reading": "しょくざい", "english": "food ingredients / ingredients", "example": "このお店はいい食材を使っています。"}, {"word": "飲む", "reading": "のむ", "english": "to drink", "example": null}, {"word": "飲み物", "reading": "のみもの", "english": "drink / beverage", "example": null}, {"word": "飲み放題", "reading": "のみほうだい", "english": "all-you-can-drink", "example": null}, {"word": "飲食店", "reading": "いんしょくてん", "english": "restaurant / food establishment", "example": "飲食店でアルバイトをします。"}, {"word": "営業する", "reading": "えいぎょうする", "english": "to be open for business", "example": "水曜日は、営業しています。"}, {"word": "営業時間", "reading": "えいぎょうじかん", "english": "business / opening hours", "example": "営業時間は、8時からです。"}, {"word": "席", "reading": "せき", "english": "seat", "example": null}, {"word": "満席", "reading": "まんせき", "english": "full / no seats available", "example": "今は満席です。"}, {"word": "空く", "reading": "あく", "english": "to become available / vacant", "example": "席が空いていません。"}, {"word": "混む", "reading": "こむ", "english": "to be crowded", "example": "お昼は店が混んでいます。"}, {"word": "混ぜる", "reading": "まぜる", "english": "to mix", "example": "よく混ぜて、食べてください。"}, {"word": "混雑する", "reading": "こんざつする", "english": "to be crowded / congested", "example": "お昼は店が混雑しています。"}, {"word": "予算", "reading": "よさん", "english": "budget", "example": null}, {"word": "予約", "reading": "よやく", "english": "reservation / booking", "example": "店の予約をします。"}, {"word": "味", "reading": "あじ", "english": "taste / flavor", "example": null}, {"word": "味わう", "reading": "あじわう", "english": "to taste / savor", "example": "おいしい料理を味わいます。"}, {"word": "調味料", "reading": "ちょうみりょう", "english": "seasoning / condiment", "example": null}, {"word": "人気", "reading": "にんき", "english": "popularity / popular", "example": null}, {"word": "雰囲気", "reading": "ふんいき", "english": "atmosphere", "example": "店の雰囲気がとてもいいです。"}, {"word": "気軽な", "reading": "きがるな", "english": "casual / easy to approach", "example": "この店は気軽に入れます。\nこの料理は気軽に食べられます。"}, {"word": "足りる", "reading": "たりる", "english": "to be enough", "example": "料理が少ないので、足りません。"}, {"word": "満足な／満足する", "reading": "まんぞくな／まんぞくする", "english": "satisfied / to be satisfied", "example": "とても満足できます。"}, {"word": "不満な", "reading": "ふまんな", "english": "dissatisfied / unsatisfied", "example": "不満なところがありますか。"}, {"word": "満点", "reading": "まんてん", "english": "full marks; full of", "example": "この料理はボリューム満点です。"}, {"word": "得／お得", "reading": "とく／おとく", "english": "a good deal / good value", "example": "お得なセットです。"}, {"word": "得る", "reading": "える", "english": "to obtain / gain", "example": "安いので、満足感を得られます。\nLINEでお得な情報を得ます。"}, {"word": "限定", "reading": "げんてい", "english": "limited / limited edition", "example": "これは今だけの限定メニューです。"}, {"word": "定食", "reading": "ていしょく", "english": "set meal", "example": null}, {"word": "定番", "reading": "ていばん", "english": "standard / classic", "example": "この料理は、このお店の定番です。"}, {"word": "定休日", "reading": "ていきゅうび", "english": "regular closing day", "example": null}, {"word": "提供する", "reading": "ていきょうする", "english": "to provide / serve", "example": "おいしい料理を提供します。\nいいサービスを提供します。"}, {"word": "地域", "reading": "ちいき", "english": "area / region / community", "example": "この地域で有名な料理を食べたいです。"}, {"word": "地元", "reading": "じもと", "english": "local area / local", "example": "このレストランは地元の人に人気です。"}, {"word": "～向け", "reading": "～むけ", "english": "for / aimed at / intended for", "example": "ここは、ファミリー向けのお店です。"}];let deck=[...original],i=0;const $=x=>document.getElementById(x);function render(){let x=deck[i];$('card').classList.remove('flipped');$('word').textContent=x.word;$('reading').textContent=x.reading;$('english').textContent=x.english;if(x.example){$('example').style.display='block';$('example').innerHTML='<b>例：</b>'+x.example.replace(/\n/g,'<br>')}else $('example').style.display='none';$('count').textContent=`Card ${i+1} / ${deck.length}`;$('fill').style.width=((i+1)/deck.length*100)+'%'}function flip(){$('card').classList.toggle('flipped')}function next(e){e.stopPropagation();i=(i+1)%deck.length;render()}function prev(e){e.stopPropagation();i=(i-1+deck.length)%deck.length;render()}function shuffle(e){e.stopPropagation();for(let n=deck.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[deck[n],deck[j]]=[deck[j],deck[n]]}i=0;render()}render();</script></body></html>
