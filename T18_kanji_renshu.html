<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanji Vocabulary Typing</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937}main{max-width:440px;margin:auto;padding:14px}
.panel{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:19px;box-shadow:0 5px 18px #1e293b12}.start{text-align:center;padding:28px 18px}.start h2{font-size:20px;margin:0 0 8px}.start p,.small{font-size:12px;color:#64748b}.partbtn{display:block;width:100%;margin:10px 0;padding:14px;border:1px solid #cbd5e1;border-radius:11px;background:#f8fafc;font-size:16px;font-weight:700;cursor:pointer}
.head{display:flex;align-items:center;font-size:12px;margin-bottom:8px}.count{margin-left:auto;color:#64748b}.home,.fs{border:0;background:none;color:#64748b;cursor:pointer}.home{padding:0 9px 0 0}.fs{font-size:17px;padding:0 0 0 9px}
.bar{height:6px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-bottom:13px}#prog{height:100%;background:#334155}.label,.help{font-size:11px;color:#64748b;margin-bottom:8px}.sentence{font-size:20px;font-weight:650;line-height:1.8;min-height:92px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}.choice{border:1px solid #cbd5e1;background:#f8fafc;border-radius:9px;padding:8px 5px;text-align:center;font-size:14px}
input{width:100%;font-size:20px;padding:10px 11px;border:2px solid #cbd5e1;border-radius:10px;outline:none}input:focus{border-color:#64748b}.buttons{display:flex;gap:8px;margin-top:10px}button.action{border:0;border-radius:9px;padding:9px;font-weight:650;cursor:pointer;flex:1}#check{background:#1f2937;color:#fff}#next{background:#e2e8f0}button:disabled{opacity:.45}
#fb{min-height:48px;margin-top:10px;font-size:14px}.ok{color:#15803d}.ng{color:#b91c1c}.answerinfo{margin-top:5px;color:#475569;font-weight:500;line-height:1.5}.finish{text-align:center;padding:25px}.score{font-size:38px;font-weight:800;margin:8px}
:fullscreen body{background:#f4f7fb}:fullscreen main{max-width:760px;padding:24px}:fullscreen .panel{padding:30px}:fullscreen .sentence{font-size:clamp(23px,3vw,34px);min-height:150px}:fullscreen .choice{font-size:18px;padding:13px}:fullscreen input{font-size:24px}
</style></head><body><main><div id="app"></div></main><script>
const SETS={"Part 1": [{"word": "練習する", "sentence": "毎日、日本語で話す（　　　　）をしています。", "answer": "練習", "reading": "れんしゅう", "english": "practice"}, {"word": "習う", "sentence": "子どもの時、ピアノを（　　　　）っていました。", "answer": "習", "reading": "なら", "english": "to learn / take lessons"}, {"word": "予習する", "sentence": "いつも、私は日本語クラスの前に（　　　　）します。", "answer": "予習", "reading": "よしゅう", "english": "to prepare for a lesson"}, {"word": "復習する", "sentence": "日本語クラスの後で、（　　　　）します。", "answer": "復習", "reading": "ふくしゅう", "english": "to review a lesson"}, {"word": "習慣", "sentence": "私はねる前に、本を読む（　　　　）があります。", "answer": "習慣", "reading": "しゅうかん", "english": "habit"}, {"word": "勉強する", "sentence": "週末、日本語を（　　　　）します。", "answer": "勉強", "reading": "べんきょう", "english": "to study"}, {"word": "強い", "sentence": "日本語を勉強したい気持ちが（　　　　）です。", "answer": "強い", "reading": "つよい", "english": "strong"}, {"word": "留学する", "sentence": "私は子どものときから、日本に（　　　　）したかったです。", "answer": "留学", "reading": "りゅうがく", "english": "to study abroad"}, {"word": "留学生", "sentence": "わたしは、（　　　　）の友だちが多いです。", "answer": "留学生", "reading": "りゅうがくせい", "english": "international student"}, {"word": "留守", "sentence": "（　　　　）にしているとき、荷物が来たことがあります。", "answer": "留守", "reading": "るす", "english": "absence / being away"}, {"word": "宿題", "sentence": "日本語クラスの（　　　　）が多いと思います。", "answer": "宿題", "reading": "しゅくだい", "english": "homework"}, {"word": "宿泊する", "sentence": "日本のホテルに（　　　　）したことがあります。", "answer": "宿泊", "reading": "しゅくはく", "english": "to stay overnight"}, {"word": "問題", "sentence": "日本語の勉強のことについて（　　　　）があります。", "answer": "問題", "reading": "もんだい", "english": "problem"}, {"word": "話題", "sentence": "友だちとどんな（　　　　）について話しますか。", "answer": "話題", "reading": "わだい", "english": "topic"}], "Part 2": [{"word": "質問", "sentence": "わからないとき、先生に（　　　　）します。", "answer": "質問", "reading": "しつもん", "english": "question"}, {"word": "質", "sentence": "日本の物の中で、カメラは（　　　　）が高いと思います。", "answer": "質", "reading": "しつ", "english": "quality"}, {"word": "問題", "sentence": "日本語の勉強で（　　　　）があります。", "answer": "問題", "reading": "もんだい", "english": "problem"}, {"word": "答え", "sentence": "日本語の宿題でわからないときは、（　　　　）を見つけるため、AIを使います。", "answer": "答え", "reading": "こたえ", "english": "answer"}, {"word": "答える", "sentence": "授業で先生の質問に（　　　　）ます。", "answer": "答え", "reading": "こたえ", "english": "to answer"}, {"word": "解答", "sentence": "テストの後で（　　　　）をもう一度、全部チェックします。", "answer": "解答", "reading": "かいとう", "english": "answer / solution"}, {"word": "計る", "sentence": "勉強のとき、時間を（　　　　）ります。", "answer": "計", "reading": "はか", "english": "to measure"}, {"word": "計画する", "sentence": "休みの前に旅行を（　　　　）します。", "answer": "計画", "reading": "けいかく", "english": "to plan"}, {"word": "時計", "sentence": "毎日、（　　　　）をつけています。", "answer": "時計", "reading": "とけい", "english": "watch / clock"}, {"word": "計算する", "sentence": "買い物をしながら、いくらか（　　　　）します。", "answer": "計算", "reading": "けいさん", "english": "to calculate"}, {"word": "考える", "sentence": "ねる前に、心配なことを（　　　　）ます。", "answer": "考え", "reading": "かんがえ", "english": "to think"}, {"word": "心", "sentence": "さいきん、映画を見て、（　　　　）があたたかくなりました。", "answer": "心", "reading": "こころ", "english": "heart / mind"}, {"word": "安心する", "sentence": "心配なとき、家族と話すと、（　　　　）します。", "answer": "安心", "reading": "あんしん", "english": "to feel relieved"}, {"word": "心配", "sentence": "試験の前は、いつも少し（　　　　）です。", "answer": "心配", "reading": "しんぱい", "english": "worried / worry"}, {"word": "心配する", "sentence": "家族は、私のことをいつも（　　　　）しています。", "answer": "心配", "reading": "しんぱい", "english": "to worry"}, {"word": "熱心", "sentence": "先生は（　　　　）にサポートしてくれます。", "answer": "熱心", "reading": "ねっしん", "english": "enthusiastically / devotedly"}, {"word": "思う", "sentence": "もっと日本語が上手になりたいと（　　　　）ます。", "answer": "思い", "reading": "おもい", "english": "to think"}, {"word": "思い出す", "sentence": "ときどき高校のときの楽しかったことを（　　　　）します。", "answer": "思い出", "reading": "おもいだ", "english": "to remember / recall"}, {"word": "テキスト", "sentence": "授業の前に（　　　　）を読みます。", "answer": "テキスト", "reading": "テキスト", "english": "textbook / text"}, {"word": "ファイル", "sentence": "パソコンの中で（　　　　）が見つからないことがあります。", "answer": "ファイル", "reading": "ファイル", "english": "file"}, {"word": "コピー", "sentence": "AIの答えを（　　　　）して、宿題を出したことがあります。", "answer": "コピー", "reading": "コピー", "english": "to copy"}, {"word": "メモ", "sentence": "忘れないように、スマホに（　　　　）します。", "answer": "メモ", "reading": "メモ", "english": "to make a note"}]};let data=[],order=[],i=0,score=0,done=false,currentPart="";const app=document.getElementById("app");
function sh(a){for(let n=a.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[a[n],a[k]]=[a[k],a[n]]}return a}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
function fsIcon(){document.querySelectorAll(".fs").forEach(b=>b.textContent=document.fullscreenElement?"✕":"⛶")}document.addEventListener("fullscreenchange",fsIcon);
function startScreen(){app.innerHTML=`<div class="panel start"><div style="text-align:right"><button class="fs" onclick="fs()">⛶</button></div><h2>Kanji Vocabulary Typing</h2><p>Choose a part to practice.</p><button class="partbtn" onclick="startPart('Part 1')">Part 1 <span class="small">(${SETS["Part 1"].length} questions)</span></button><button class="partbtn" onclick="startPart('Part 2')">Part 2 <span class="small">(${SETS["Part 2"].length} questions)</span></button></div>`;fsIcon()}
function startPart(p){currentPart=p;data=SETS[p];order=sh([...Array(data.length).keys()]);i=0;score=0;render()}
function opts(t){let pool=[...new Set(data.map(x=>x.word).filter(x=>x!==t))];sh(pool);return sh([t,...pool.slice(0,3)])}
function render(){done=false;let q=data[order[i]];app.innerHTML=`<div class="head"><button class="home" onclick="startScreen()">⌂ Top</button><b>${currentPart}</b><span class="count">${i+1} / ${data.length}</span><button class="fs" onclick="fs()">⛶</button></div><div class="bar"><div id="prog" style="width:${i/data.length*100}%"></div></div><div class="panel"><div class="label">Choose from the 4 words and type the missing kanji vocabulary.</div><div class="sentence">${q.sentence}</div><div class="help">Word Bank</div><div class="choices">${opts(q.word).map(x=>`<div class="choice">${x}</div>`).join("")}</div><input id="ans" placeholder="Type the missing word" autocomplete="off"><div class="buttons"><button class="action" id="check" onclick="check()">Check</button><button class="action" id="next" onclick="next()" disabled>Next</button></div><div id="fb"></div></div>`;fsIcon();let a=document.getElementById("ans");a.focus();a.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();done?next():check()}})}
function check(){if(done)return;let q=data[order[i]],v=document.getElementById("ans").value.trim();done=true;let fb=document.getElementById("fb"),good=v===q.answer;if(good)score++;fb.className=good?"ok":"ng";fb.innerHTML=(good?"<b>✓ Correct!</b>":(v?"<b>✗ Answer: "+q.answer+"</b>":"<b>Answer: "+q.answer+"</b>"))+`<div class="answerinfo">Reading: <b>${q.reading}</b><br>English: <b>${q.english}</b></div>`;document.getElementById("ans").disabled=true;document.getElementById("check").disabled=true;document.getElementById("next").disabled=false;document.getElementById("next").focus()}
function next(){i++;if(i<data.length){render();return}app.innerHTML=`<div class="panel finish"><button class="fs" style="float:right" onclick="fs()">⛶</button><div class="small">${currentPart} Finished</div><div class="score">${score} / ${data.length}</div><div class="buttons"><button class="action" onclick="startPart('${currentPart}')">Practice Again</button><button class="action" onclick="startScreen()">⌂ Top</button></div></div>`;fsIcon()}
startScreen();</script></body></html>
